# ClusterEndpointType: s4-http
#
# Scenario 4's type for HTTP workload endpoints. The routes are the same in
# every environment; what the gateway enforces on them follows the
# environment:
#
#   environment     protection    enforced
#   development     open          nothing
#   staging         rateLimited   requestsPerMinute (default 300)
#   anything else   apiKey        API keys + requestsPerMinute (default 60)
#
# Only the environments listed by name are relaxed. A new environment, such as
# production or a second production region, gets the strictest protection
# until the type says otherwise: it fails closed.
#
# The developer sets only pathPrefix and cors, the same everywhere. Whoever
# deploys to an environment can override the protection, the rate limit and
# the keys on that environment's EndpointReleaseBinding through
# environmentConfigs.
#
# The environment is matched by name: Environment.spec.isProduction is not in
# an EndpointType's CEL context. Rename the environments here to fit yours.
#
# Protected environments need the kgateway data plane gateway, and the
# data-plane cluster-agent must be allowed to manage gateway.kgateway.dev
# trafficpolicies. An open environment renders plain HTTPRoutes and works on
# any Gateway API implementation.
apiVersion: openchoreo.dev/v1alpha1
kind: ClusterEndpointType
metadata:
  name: s4-http
  annotations:
    openchoreo.dev/display-name: HTTP (scenario 4)
    openchoreo.dev/description: HTTP route that is open in development, rate limited in staging, and requires API keys everywhere else.
spec:
  parameters:
    openAPIV3Schema:
      type: object
      properties:
        pathPrefix:
          type: string
          default: /
          description: Public path the endpoint is served under. Requests are rewritten to the backends' base path.
        cors:
          type: boolean
          default: false
          description: Allow browsers to call the endpoint cross-origin, e.g. from an API console.

  environmentConfigs:
    openAPIV3Schema:
      type: object
      properties:
        protection:
          type: string
          enum: [open, rateLimited, apiKey]
          description: >-
            What the gateway enforces in this environment. Unset follows the environment: open in development,
            rateLimited in staging, apiKey everywhere else.
        requestsPerMinute:
          type: integer
          minimum: 1
          description: >-
            Requests per minute the gateway admits, per gateway replica, when protection is rateLimited or apiKey.
            Unset is 300 in staging and 60 everywhere else.
        apiKeys:
          type: object
          additionalProperties:
            type: string
          description: >-
            API keys accepted when protection is apiKey, by client name. Demo only: the keys are stored in plain
            text on the EndpointReleaseBinding and rendered into a Secret on the data plane.
        hostname:
          type: string
          description: Optional hostname to serve the endpoint on in this environment, replacing the generated one.

  validations:
    - rule: '${backends.all(b, b.protocol == "HTTP")}'
      message: "s4-http only routes HTTP workload endpoints."
    # One rewrite filter serves every backend, so they must share a base path.
    - rule: "${backends.all(b, b.basePath == backends[0].basePath)}"
      message: "All backends of an s4-http Endpoint must serve under the same base path."

  # The effective protection appears in several places below, always as:
  #
  #   environmentConfigs.?protection.orValue(
  #     metadata.environmentName == "development" ? "open"
  #     : metadata.environmentName == "staging" ? "rateLimited" : "apiKey")
  resources:
    - id: httproute-external
      includeWhen: '${"external" in visibility && gateway.?ingress.?external.hasValue()}'
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${oc_generate_name(metadata.name, "external")}
          namespace: ${metadata.namespace}
          labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-visibility": "external"})}'
        spec:
          parentRefs:
            - name: ${gateway.ingress.external.name}
              namespace: ${gateway.ingress.external.namespace}
          hostnames: |
            ${has(environmentConfigs.hostname)
              ? [environmentConfigs.hostname]
              : [gateway.ingress.external.?http, gateway.ingress.external.?https]
                  .filter(g, g.hasValue()).map(g, g.value().host).distinct()
                  .map(h, oc_dns_label(metadata.endpointName, metadata.environmentName, metadata.projectName, metadata.endpointNamespace) + "." + h)}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: ${parameters.pathPrefix}
              filters: |
                ${[{"type": "URLRewrite", "urlRewrite": {"path": {"type": "ReplacePrefixMatch",
                    "replacePrefixMatch": backends.size() > 0 ? backends[0].basePath : "/"}}}]
                  + (parameters.cors ? [{"type": "CORS", "cors": {
                      "allowOrigins": ["*"],
                      "allowMethods": ["GET", "POST", "PUT", "DELETE", "PATCH", "OPTIONS", "HEAD"],
                      "allowHeaders": ["*"], "exposeHeaders": ["*"], "allowCredentials": false}}] : [])}
              backendRefs: '${backends.map(b, {"name": b.serviceName, "port": b.port, "weight": b.weight})}'

    - id: httproute-internal
      includeWhen: '${"internal" in visibility && gateway.?ingress.?internal.hasValue()}'
      template:
        apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: ${oc_generate_name(metadata.name, "internal")}
          namespace: ${metadata.namespace}
          labels: '${oc_merge(metadata.labels, {"openchoreo.dev/endpoint-visibility": "internal"})}'
        spec:
          parentRefs:
            - name: ${gateway.ingress.internal.name}
              namespace: ${gateway.ingress.internal.namespace}
          hostnames: |
            ${[gateway.ingress.internal.?http, gateway.ingress.internal.?https]
              .filter(g, g.hasValue()).map(g, g.value().host).distinct()
              .map(h, oc_dns_label(metadata.endpointName, metadata.environmentName, metadata.projectName, metadata.endpointNamespace) + "." + h)}
          rules:
            - matches:
                - path:
                    type: PathPrefix
                    value: ${parameters.pathPrefix}
              filters:
                - type: URLRewrite
                  urlRewrite:
                    path:
                      type: ReplacePrefixMatch
                      replacePrefixMatch: '${backends.size() > 0 ? backends[0].basePath : "/"}'
              backendRefs: '${backends.map(b, {"name": b.serviceName, "port": b.port, "weight": b.weight})}'

    # One policy covers every route this Endpoint renders. Not rendered while the
    # environment is open.
    - id: traffic-policy
      includeWhen: |
        ${environmentConfigs.?protection.orValue(
            metadata.environmentName == "development" ? "open"
            : metadata.environmentName == "staging" ? "rateLimited" : "apiKey") != "open"
          && (("external" in visibility && gateway.?ingress.?external.hasValue())
            || ("internal" in visibility && gateway.?ingress.?internal.hasValue()))}
      template:
        apiVersion: gateway.kgateway.dev/v1alpha1
        kind: TrafficPolicy
        metadata:
          name: ${oc_generate_name(metadata.name, "policy")}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        spec:
          targetRefs: |
            ${(("external" in visibility && gateway.?ingress.?external.hasValue())
                ? [{"group": "gateway.networking.k8s.io", "kind": "HTTPRoute", "name": oc_generate_name(metadata.name, "external")}]
                : [])
              + (("internal" in visibility && gateway.?ingress.?internal.hasValue())
                ? [{"group": "gateway.networking.k8s.io", "kind": "HTTPRoute", "name": oc_generate_name(metadata.name, "internal")}]
                : [])}
          rateLimit:
            local:
              tokenBucket:
                maxTokens: '${environmentConfigs.?requestsPerMinute.orValue(metadata.environmentName == "staging" ? 300 : 60)}'
                tokensPerFill: '${environmentConfigs.?requestsPerMinute.orValue(metadata.environmentName == "staging" ? 300 : 60)}'
                fillInterval: 60s
          apiKeyAuth: |
            ${environmentConfigs.?protection.orValue(
                metadata.environmentName == "development" ? "open"
                : metadata.environmentName == "staging" ? "rateLimited" : "apiKey") == "apiKey"
              ? {"secretRef": {"name": oc_generate_name(metadata.name, "api-keys")}}
              : oc_omit()}

    # The keys apiKeyAuth checks: one entry per client. With no keys set for the
    # environment every request is rejected until some are.
    - id: api-keys
      includeWhen: |
        ${environmentConfigs.?protection.orValue(
            metadata.environmentName == "development" ? "open"
            : metadata.environmentName == "staging" ? "rateLimited" : "apiKey") == "apiKey"}
      template:
        apiVersion: v1
        kind: Secret
        metadata:
          name: ${oc_generate_name(metadata.name, "api-keys")}
          namespace: ${metadata.namespace}
          labels: ${metadata.labels}
        type: extauth.solo.io/apikey
        stringData: '${environmentConfigs.?apiKeys.orValue({})}'

  # Where clients reach the endpoint for each requested visibility, reported on
  # the EndpointReleaseBinding's status.urls. The security follows the same
  # protection as the TrafficPolicy, so a client can read from the binding
  # whether this environment wants a key.
  urls:
    external:
      includeWhen: '${gateway.?ingress.?external.?https.hasValue() || gateway.?ingress.?external.?http.hasValue()}'
      scheme: '${gateway.ingress.external.?https.hasValue() ? "https" : "http"}'
      host: |-
        ${has(environmentConfigs.hostname) ? environmentConfigs.hostname
          : oc_dns_label(metadata.endpointName, metadata.environmentName, metadata.projectName, metadata.endpointNamespace) + "." + gateway.ingress.external.?https.or(gateway.ingress.external.?http).value().host}
      port: '${gateway.ingress.external.?https.or(gateway.ingress.external.?http).value().?port.orValue(gateway.ingress.external.?https.hasValue() ? 443 : 80)}'
      path: ${parameters.pathPrefix}
      security:
        scheme: |-
          ${environmentConfigs.?protection.orValue(
              metadata.environmentName == "development" ? "open"
              : metadata.environmentName == "staging" ? "rateLimited" : "apiKey") == "apiKey" ? "apiKey" : "none"}
        apiKey:
          in: header
          name: api-key
    internal:
      includeWhen: '${gateway.?ingress.?internal.?https.hasValue() || gateway.?ingress.?internal.?http.hasValue()}'
      scheme: '${gateway.ingress.internal.?https.hasValue() ? "https" : "http"}'
      host: '${oc_dns_label(metadata.endpointName, metadata.environmentName, metadata.projectName, metadata.endpointNamespace) + "." + gateway.ingress.internal.?https.or(gateway.ingress.internal.?http).value().host}'
      port: '${gateway.ingress.internal.?https.or(gateway.ingress.internal.?http).value().?port.orValue(gateway.ingress.internal.?https.hasValue() ? 443 : 80)}'
      path: ${parameters.pathPrefix}
      security:
        scheme: |-
          ${environmentConfigs.?protection.orValue(
              metadata.environmentName == "development" ? "open"
              : metadata.environmentName == "staging" ? "rateLimited" : "apiKey") == "apiKey" ? "apiKey" : "none"}
        apiKey:
          in: header
          name: api-key
